<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | ZyroDev</title>
  <link rel="icon" type="image/png" href="./fotos/zraposa.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #ff6500;
      --text: #1f1f1f;
      --muted: #7d7d7d;
      --line: #e7e7e7;
    }

    html, body { min-height: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(255, 101, 0, .20), transparent 28%),
        radial-gradient(circle at 85% 90%, rgba(255, 101, 0, .16), transparent 30%),
        #111;
      overflow-x: hidden;
    }

    .login-shell {
      width: min(930px, 100%);
      min-height: 600px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      border: 9px solid #fff;
      border-radius: 50px;
      background: #fff;
      box-shadow: 0 25px 80px rgba(0,0,0,.45);
    }

    .visual {
      min-height: 582px;
      position: relative;
      overflow: hidden;
      background: #21130e;
    }

    .visual img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }

    .form-panel {
      min-height: 582px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 70px;
    }

    .form-content {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    h1 {
      color: var(--text);
      font-size: 25px;
      line-height: 1.2;
      margin-bottom: 24px;
      font-weight: 800;
    }

    .google-btn,
    .submit-btn {
      width: 100%;
      height: 41px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 600;
      font-family: inherit;
    }

    .google-btn {
      border: 1px solid var(--line);
      background: #fff;
      color: #444;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      cursor: pointer;
      transition: .2s ease;
    }

    .google-btn:hover {
      border-color: #cfcfcf;
      box-shadow: 0 4px 14px rgba(0,0,0,.07);
      transform: translateY(-1px);
    }

    .google-icon { width: 17px; height: 17px; }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 18px 0 25px;
      color: #999;
      font-size: 11px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #e5e5e5;
      flex: 1;
    }

    .field { margin-bottom: 12px; }

    .field input {
      width: 100%;
      height: 41px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 7px;
      outline: none;
      background: #fff;
      color: #222;
      font: 11px inherit;
    }

    .field input:focus {
      border-color: #cfcfcf;
      box-shadow: 0 0 0 3px rgba(255,101,0,.08);
    }

    .field input::placeholder { color: #777; }

    .password-wrap { position: relative; }

    .password-wrap input { padding-right: 40px; }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #777;
      cursor: pointer;
      padding: 3px;
      font-size: 14px;
    }

    .forgot {
      text-align: right;
      margin: -2px 0 16px;
    }

    .forgot a {
      color: #888;
      font-size: 10px;
      text-decoration: none;
    }

    .forgot a:hover { color: var(--orange); }

    .submit-btn {
      border: 0;
      background: var(--orange);
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      transition: .2s ease;
    }

    .submit-btn:hover {
      background: #f05c00;
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(255,101,0,.22);
    }

    .submit-btn:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .register-row {
      margin-top: 11px;
      color: #777;
      font-size: 10px;
    }

    .register-row a {
      color: var(--orange);
      text-decoration: none;
      font-weight: 600;
    }

    #erroLogin {
      min-height: 0;
      margin-top: 10px;
      color: #c0392b;
      font-size: 10px;
      line-height: 1.4;
    }

    .socials {
      margin-top: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      color: #777;
    }

    .socials a {
      color: #777;
      text-decoration: none;
      font-size: 15px;
      line-height: 1;
      transition: .2s;
    }

    .socials a:hover { color: var(--orange); }

    @media (max-width: 760px) {
      body { padding: 10px; }

      .login-shell {
        grid-template-columns: 1fr;
        max-width: 460px;
        min-height: auto;
        border-radius: 34px;
      }

      .visual { display: none; }

      .form-panel {
        min-height: 580px;
        padding: 46px 34px;
      }
    }

    @media (max-width: 390px) {
      .login-shell { border-width: 6px; border-radius: 28px; }
      .form-panel { padding: 40px 24px; }
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="visual" aria-label="Área visual">
      <img src="fotos/zraposa.png" alt="">
    </section>

    <section class="form-panel">
      <div class="form-content">
        <h1>Create Account</h1>

        <button id="btnGoogle" class="google-btn" type="button">
          <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21.35 12.23c0-.78-.07-1.53-.2-2.23H12v4.22h5.25a4.49 4.49 0 0 1-1.95 2.95v2.45h3.15c1.84-1.7 2.9-4.2 2.9-7.39Z" fill="#4285F4"/>
            <path d="M12 21.98c2.63 0 4.84-.87 6.45-2.36l-3.15-2.45c-.87.58-1.98.93-3.3.93-2.54 0-4.69-1.72-5.46-4.03H3.28v2.53A9.75 9.75 0 0 0 12 21.98Z" fill="#34A853"/>
            <path d="M6.54 14.07a5.87 5.87 0 0 1 0-3.74V7.8H3.28a9.75 9.75 0 0 0 0 8.8l3.26-2.53Z" fill="#FBBC05"/>
            <path d="M12 6.3c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.41 14.63 2.54 12 2.54a9.75 9.75 0 0 0-8.72 5.26l3.26 2.53C7.31 8.02 9.46 6.3 12 6.3Z" fill="#EA4335"/>
          </svg>
          Entrar com Google
        </button>

        <div class="divider">or</div>

        <div class="field">
          <input id="nomeInput" type="text" placeholder="Nome" autocomplete="name">
        </div>

        <div class="field">
          <input id="emailInput" type="email" placeholder="Email" autocomplete="email">
        </div>

        <div class="field password-wrap">
          <input id="senhaInput" type="password" placeholder="Password" autocomplete="new-password">
          <button class="toggle-password" type="button" id="togglePassword" aria-label="Mostrar senha">⌧</button>
        </div>

        <div id="forgotPasswordWrap" class="forgot" style="display:none"><a id="forgotPassword" href="#">Esqueci minha senha</a></div>

        <button class="submit-btn" type="button">Create Account</button>

        <div class="register-row">
          Já tenho uma conta? <a href="#">Login</a>
        </div>

        <div id="erroLogin" role="alert" aria-live="polite"></div>

        <div class="socials" aria-label="Redes sociais">
          <a href="https://www.instagram.com/delarotaldev" target="_blank" rel="noopener noreferrer" aria-label="Instagram">◎</a>
          <a href="https://github.com/victortx1" target="_blank" rel="noopener noreferrer" aria-label="GitHub">GH</a>
          <a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">in</a>
          <a href="https://www.youtube.com/@delarotaldev" target="_blank" rel="noopener noreferrer" aria-label="YouTube">▶</a>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="./login.js"></script>
  <script>
    const toggle = document.getElementById('togglePassword');
    const senha = document.getElementById('senhaInput');
    toggle?.addEventListener('click', () => {
      senha.type = senha.type === 'password' ? 'text' : 'password';
      toggle.textContent = senha.type === 'password' ? '⌧' : '◉';
    });
  </script>
<script src="./i18n.js"></script>
<script src="./guia-zyro.js" defer></script>
</body>
</html>
