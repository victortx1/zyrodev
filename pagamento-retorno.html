<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="./fotos/zraposa.png">
<title>Pagamento | ZyroDev</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}.box{width:min(560px,100%);padding:32px;border:1px solid rgba(255,106,0,.22);border-radius:24px;background:#101010;text-align:center;box-shadow:0 30px 100px #000}.icon{font-size:54px;margin-bottom:10px}.box h1{margin:0 0 10px}.box p{color:#888;line-height:1.7;font-size:14px}.status{margin:20px 0;padding:14px;border-radius:14px;background:#0a0a0a;border:1px solid rgba(255,255,255,.08);color:#bbb}.btn{display:inline-block;margin-top:10px;padding:12px 18px;border-radius:12px;background:#ff6a00;color:#111;font-weight:900;text-decoration:none}.small{font-size:11px!important;color:#666!important}
</style>
</head>
<body>
<div class="box">
  <div class="icon" id="icon">⌛</div>
  <h1 id="title">Verificando pagamento...</h1>
  <p id="text">Estamos aguardando a confirmação automática do Mercado Pago.</p>
  <div class="status" id="status">Consultando pedido...</div>
  <a class="btn" href="./loja-vip.html">Voltar para a loja</a>
  <p class="small">A página de retorno não confirma o pagamento sozinha. A liberação acontece somente depois do webhook de confirmação.</p>
</div>
<script type="module">
import { auth } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const params = new URLSearchParams(location.search);
const orderId = params.get("orderId") || sessionStorage.getItem("zyrodev_pedido_atual") || "";
const statusUrl = "./api/pagamento/status";

const icon = document.getElementById("icon");
const title = document.getElementById("title");
const text = document.getElementById("text");
const statusEl = document.getElementById("status");

async function verificar(user) {
  if (!orderId) {
    icon.textContent = "⚠️";
    title.textContent = "Pedido não encontrado";
    text.textContent = "Volte para a loja e inicie uma nova compra.";
    statusEl.textContent = "Nenhum pedido foi informado.";
    return true;
  }

  const token = await user.getIdToken();
  const response = await fetch(`${statusUrl}?orderId=${encodeURIComponent(orderId)}`, { headers: { Authorization: `Bearer ${token}` } });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || "Falha ao consultar pedido.");

  if (data.status === "pago") {
    icon.textContent = "✅";
    title.textContent = "Pagamento confirmado!";
    text.textContent = "Seu benefício já foi liberado automaticamente no Firebase.";
    statusEl.textContent = `${data.produtoNome || "Produto"} • ${Number(data.valor || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" })}`;
    sessionStorage.removeItem("zyrodev_pedido_atual");
    return true;
  }

  if (data.status === "cancelado" || data.status === "expirado") {
    icon.textContent = "❌";
    title.textContent = data.status === "expirado" ? "Pagamento expirado" : "Pagamento cancelado";
    text.textContent = "Nenhum benefício foi liberado para este pedido.";
    statusEl.textContent = `Status: ${data.status}`;
    return true;
  }

  icon.textContent = "⌛";
  title.textContent = "Aguardando confirmação...";
  text.textContent = "O PIX ainda não foi confirmado pelo provedor. Esta página atualiza automaticamente.";
  statusEl.textContent = "Status do pedido: pendente";
  return false;
}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    icon.textContent = "🔐";
    title.textContent = "Faça login novamente";
    text.textContent = "Precisamos da sua conta para consultar o pedido.";
    statusEl.textContent = "Sessão não encontrada.";
    return;
  }

  let finalizado = false;
  for (let i = 0; i < 30 && !finalizado; i++) {
    try { finalizado = await verificar(user); }
    catch (error) { console.error(error); statusEl.textContent = "Aguardando o servidor..."; }
    if (!finalizado) await new Promise(r => setTimeout(r, 3000));
  }
});
</script>
</body>
</html>
