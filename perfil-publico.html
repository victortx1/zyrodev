<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Perfil público | ZyroDev</title>
<link rel="icon" type="image/png" href="./fotos/zraposa.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}
:root{--orange:#ff6a00;--orange2:#ff8533}
body{min-height:100vh;color:#fff;background:#050505;padding:18px 14px 60px;overflow-x:hidden;position:relative}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 10% 0%,rgba(255,106,0,.20),transparent 32%),radial-gradient(circle at 90% 100%,rgba(255,106,0,.15),transparent 34%);pointer-events:none;z-index:0}
body:after{content:"";position:fixed;inset:0;background-image:var(--profile-banner-bg);background-size:cover;background-position:center;opacity:.10;filter:blur(2px);pointer-events:none;z-index:0}
.container{width:min(920px,100%);margin:auto;position:relative;z-index:1}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.back-btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#ddd;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);padding:10px 14px;border-radius:13px;font-size:.84rem;font-weight:800;transition:.2s}
.back-btn:hover{background:rgba(255,106,0,.10);border-color:rgba(255,106,0,.25);transform:translateY(-1px)}
.profile-card{position:relative;overflow:hidden;width:100%;border-radius:28px;background:rgba(13,13,13,.90);border:1px solid rgba(255,255,255,.09);box-shadow:0 30px 90px rgba(0,0,0,.48);backdrop-filter:blur(18px);animation:fadeUp .45s ease}
.profile-card:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,106,0,.07),transparent 35%,rgba(255,106,0,.03));pointer-events:none}
.banner{height:235px;background:#161616 center/cover no-repeat;position:relative;overflow:hidden}
.banner:before{content:"";position:absolute;inset:0;background:var(--banner-bg);background-size:cover;background-position:center;opacity:1}
.banner:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.18) 42%,rgba(5,5,5,.96) 100%)}
.banner.sem-banner:before{background:radial-gradient(circle at 50% 30%,rgba(255,106,0,.15),transparent 40%),linear-gradient(135deg,#111,#202020)}
.content{position:relative;z-index:2;padding:0 30px 28px}
.topo{display:flex;align-items:flex-end;gap:18px;margin-top:-64px;position:relative;z-index:3}
.perfil-media-wrap{width:128px;height:128px;flex:0 0 128px;position:relative;overflow:visible}
.foto,.video-perfil{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:4px solid #0b0b0b;background:#171717;position:relative;z-index:1}
.avatar-frame-overlay{
  position:absolute;
  inset:-24px;
  z-index:2;
  pointer-events:none;
  background-position:center;
  background-size:contain;
  background-repeat:no-repeat;
  animation:frameFloat 3.2s ease-in-out infinite;
}
.avatar-frame-overlay.moldura-animada{
  animation:frameFloat 2.7s ease-in-out infinite, framePulse 2.2s ease-in-out infinite;
}
@keyframes frameFloat{
  0%,100%{transform:translateY(0) rotate(0deg)}
  50%{transform:translateY(-2px) rotate(.8deg)}
}
@keyframes framePulse{
  0%,100%{filter:drop-shadow(0 0 2px rgba(255,106,0,.15))}
  50%{filter:drop-shadow(0 0 10px rgba(255,106,0,.65))}
}
.avatar-frame:not([style*="background-image"]){padding:0}
.info-topo{padding-bottom:7px;min-width:0;flex:1}
.nome-linha{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nome-linha h1{font-size:clamp(1.65rem,4vw,2.2rem);line-height:1.1;font-weight:900;letter-spacing:-.035em;word-break:break-word}
.handle{color:#858585;font-size:.86rem;margin-top:6px;font-weight:600}
.badges-perfil{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge-icon{width:29px;height:29px;object-fit:contain;display:block;filter:drop-shadow(0 0 7px rgba(255,106,0,.25));transition:.2s}
.badge-icon:hover{transform:scale(1.08)}
.bio-box{margin-top:23px;padding:18px;border-radius:17px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.075);color:#ddd;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.profile-info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:11px}
.info-box{min-width:0;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.065)}
.info-label{font-size:.67rem;color:#666;text-transform:uppercase;letter-spacing:.11em;font-weight:800;margin-bottom:5px}
.info-value{font-size:.88rem;color:#ddd;font-weight:700;word-break:break-word}
.info-value a{color:var(--orange2);text-decoration:none}
.info-value a:hover{text-decoration:underline}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:11px}
.stat-box{padding:15px 16px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}
.stat-label{font-size:.7rem;color:#666;text-transform:uppercase;letter-spacing:.10em;font-weight:800;margin-bottom:7px}
.stat-value{font-size:1.35rem;font-weight:900}
.stat-value.orange{color:var(--orange2)}
.links-box{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.social-link,.empty-link-box{display:inline-flex;align-items:center;text-decoration:none;color:#ddd;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.075);padding:10px 13px;border-radius:13px;font-size:.8rem;font-weight:800;transition:.2s}
.social-link:hover{background:rgba(255,106,0,.10);border-color:rgba(255,106,0,.25);transform:translateY(-1px)}
.like-area{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}
.like-btn{border:0;cursor:pointer;padding:12px 17px;border-radius:13px;font-size:.86rem;font-weight:900;color:#fff;background:linear-gradient(135deg,#ff6a00,#ff8533);box-shadow:0 10px 28px rgba(255,106,0,.22);transition:.2s}
.like-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 14px 34px rgba(255,106,0,.30)}
.like-btn:disabled{opacity:.65;cursor:not-allowed}
.like-status{color:#777;font-size:.8rem;font-weight:600}
.message-box,.loading-box{text-align:center;padding:25px;border-radius:20px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);color:#888}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:620px){
body{padding:10px 9px 45px}.banner{height:170px}.content{padding:0 16px 20px}
.topo{margin-top:-48px;gap:12px;align-items:flex-end}.perfil-media-wrap,.avatar-frame{width:96px;height:96px;flex-basis:96px}
.nome-linha h1{font-size:1.4rem}.handle{font-size:.76rem}
.profile-info-grid,.stats-grid{grid-template-columns:1fr}.bio-box{font-size:.9rem}
}
.perfil-role-admin .profile-card{border-color:rgba(245,197,66,.55)!important;box-shadow:0 0 45px rgba(245,197,66,.18)}.perfil-role-admin #profileNome{color:#f5c542}.perfil-role-sponsor .profile-card{border-color:rgba(37,99,235,.55)!important;box-shadow:0 0 45px rgba(37,99,235,.18)}.perfil-role-sponsor #profileNome{color:#4f8cff}.perfil-role-creator .profile-card{border-color:rgba(168,85,247,.55)!important;box-shadow:0 0 45px rgba(168,85,247,.18)}.perfil-role-creator #profileNome{color:#c084fc}</style>
</head>
<body id="bodyPerfilPublico">
<div class="container">
  <div class="top-bar"><a href="./ranking.html" class="back-btn">← Voltar ao ranking</a> <a href="./perfil.html" class="back-btn">← Voltar ao perfil</a> </div> 
  <div id="loadingBox" class="loading-box">Carregando perfil...</div>
  <div id="errorBox" class="message-box" style="display:none"></div>

  <main id="profileCard" class="profile-card" style="display:none">
    <div id="bannerPerfil" class="banner sem-banner"></div>
    <div class="content">
      <div class="topo">
        <div id="perfilMediaWrap" class="perfil-media-wrap"></div>
        <div class="info-topo">
          <div class="nome-linha">
            <h1 id="profileNome">Usuário</h1>
            <span id="badgesInline" class="badges-perfil"></span>
          </div>
          <div id="profileHandle" class="handle">@usuario</div>
        </div>
      </div>

      <div id="profileBio" class="bio-box">Sem bio.</div>

      <div class="profile-info-grid">
        <div id="empresaBox" class="info-box" style="display:none">
          <div class="info-label">Empresa / trabalho</div>
          <div id="profileEmpresa" class="info-value"></div>
        </div>
        <div id="siteBox" class="info-box" style="display:none">
          <div class="info-label">Site</div>
          <div class="info-value"><a id="profileSite" target="_blank" rel="noopener noreferrer"></a></div>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-box"><div class="stat-label">Pontuação</div><div id="profilePontos" class="stat-value">0</div></div>
        <div class="stat-box"><div class="stat-label">Curtidas recebidas</div><div id="profileLikes" class="stat-value orange">0</div></div>
      </div>

      <div id="linksBox" class="links-box"></div>

      <div class="like-area">
        <button id="likeBtn" class="like-btn">♥ Curtir perfil</button>
        <div id="likeStatus" class="like-status"></div>
      </div>
    </div>
  </main>
</div>

<script type="module">
import {auth,db} from "./firebase.js";
import {onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {doc,getDoc,runTransaction,increment,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {isValidUid,sanitizeMediaUrl,sanitizeSocialUrl,createRateLimiter} from "./security-utils.js";

const loadingBox=document.getElementById("loadingBox"),errorBox=document.getElementById("errorBox"),profileCard=document.getElementById("profileCard");
const body=document.getElementById("bodyPerfilPublico"),banner=document.getElementById("bannerPerfil"),media=document.getElementById("perfilMediaWrap");
const nome=document.getElementById("profileNome"),handle=document.getElementById("profileHandle"),bio=document.getElementById("profileBio");
const badgesInline=document.getElementById("badgesInline"),empresaBox=document.getElementById("empresaBox"),empresa=document.getElementById("profileEmpresa");
const siteBox=document.getElementById("siteBox"),site=document.getElementById("profileSite"),pontos=document.getElementById("profilePontos"),likes=document.getElementById("profileLikes");
const links=document.getElementById("linksBox"),likeBtn=document.getElementById("likeBtn"),likeStatus=document.getElementById("likeStatus");

const params=new URLSearchParams(location.search);
const perfilUidRaw=params.get("uid");
const perfilUid=isValidUid(perfilUidRaw)?perfilUidRaw:null;
let usuarioLogado=null,perfilData=null;
const limitarLike=createRateLimiter(2000);

const BADGES_CONFIG={
  fundador:["./fotos/fundador.png","Fundador"],
  copa_do_mundo:["./fotos/copa_do_mundo.png","Copa do Mundo"],
  primeira_temporada:["./fotos/temporada1.png","Primeira Temporada"],
  socio:["./fotos/sociozyro.png","Sócio"],
  patrocinador:["./fotos/sponsor.png","Patrocinador"],
  criador:["./fotos/criadorzyro.pngz","Criador"],
};

function formatNumber(v){return Number(v||0).toLocaleString("pt-BR")}
function normalizarBadges(b){
  if(Array.isArray(b))return b.filter(Boolean);
  if(b&&typeof b==="object")return Object.keys(b).filter(k=>b[k]===true);
  return [];
}
function getHandle(email,nome){
  if(email&&email.includes("@"))return "@"+email.split("@")[0];
  if(nome)return "@"+nome.toLowerCase().replace(/\s+/g,"");
  return "@usuario";
}
function hojeId(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function showError(msg){
  loadingBox.style.display="none";profileCard.style.display="none";errorBox.style.display="block";errorBox.textContent=msg;
}
function usuarioPodeUsarVideo(dados={}){
  const b=normalizarBadges(dados.badges);
  return b.includes("fundador")||b.includes("socio");
}
function renderMedia(data){
  media.innerHTML="";
  const foto=sanitizeMediaUrl(data.foto)||"https://via.placeholder.com/150x150.png?text=User";
  const video=sanitizeMediaUrl(data.videoPerfil)||"";
  if(usuarioPodeUsarVideo(data)&&video){
    const v=document.createElement("video");
    v.className="video-perfil";v.src=video;v.autoplay=true;v.loop=true;v.muted=true;v.playsInline=true;
    media.appendChild(v);return;
  }
  const moldura=data.decoracaoAtiva===false?"":(sanitizeMediaUrl(data.molduraPerfil)||"");
  const img=document.createElement("img");img.className="foto";img.src=foto;img.alt="Foto do perfil";
  media.appendChild(img);

  if(moldura){
    const frame=document.createElement("div");
    frame.className="avatar-frame-overlay";
    frame.style.backgroundImage=`url("${moldura}")`;
    const moldurasAnimadas=["moldura-fogo.svg","moldura-neon.svg","moldura-nova-era.svg","moldura-galaxia.svg"];
    if(moldurasAnimadas.some(nome=>moldura.includes(nome))) frame.classList.add("moldura-animada");
    media.appendChild(frame);
  }
}
function renderBadges(badges){
  badgesInline.innerHTML="";
  badges.forEach(id=>{
    const cfg=BADGES_CONFIG[id];
    if(!cfg)return;
    const img=document.createElement("img");img.className="badge-icon";img.src=cfg[0];img.alt=cfg[1];img.title=cfg[1];badgesInline.appendChild(img);
  });
}
function renderSocial(url,label){
  const safe=sanitizeSocialUrl(url);if(!safe)return;
  const a=document.createElement("a");a.className="social-link";a.href=safe;a.target="_blank";a.rel="noopener noreferrer";a.textContent=label;links.appendChild(a);
}
function renderProfile(data){
  perfilData=data;
  const bannerUrl=sanitizeMediaUrl(data.banner)||"";
  banner.style.setProperty("--banner-bg",bannerUrl?`url("${bannerUrl}")`:"none");
  banner.classList.toggle("sem-banner",!bannerUrl);
  body.style.setProperty("--profile-banner-bg",bannerUrl?`url("${bannerUrl}")`:"none");

  nome.textContent=data.nome?.trim()||"Usuário";
  handle.textContent=getHandle(data.email,data.nome);
  bio.textContent=data.bio?.trim()||"Esse usuário ainda não adicionou uma bio.";
  pontos.textContent=formatNumber(data.pontos||0);
  likes.textContent=formatNumber(data.likesRecebidos ?? data.likes ?? 0);

  const badges=normalizarBadges(data.badges);
  renderBadges(badges);
   const corPerfil = data.admin === true ? "#f5c542" : data.patrocinador === true ? "#2563eb" : data.criador === true ? "#a855f7" : "#ffffff";
   nome.style.color = "";
   nome.style.textShadow = corPerfil !== "#ffffff" ? `0 0 14px ${corPerfil}88` : "";
  nome.style.fontWeight = corPerfil !== "#ffffff" ? "900" : "";
  body.classList.remove("perfil-role-admin","perfil-role-sponsor","perfil-role-creator");
  if(data.admin===true) body.classList.add("perfil-role-admin");
  else if(data.patrocinador===true) body.classList.add("perfil-role-sponsor");
  else if(data.criador===true) body.classList.add("perfil-role-creator");
  body.style.setProperty("--profile-accent", corPerfil);
  renderMedia(data);

  const emp=data.empresa?.trim()||"";
  empresa.textContent=emp;empresaBox.style.display=emp?"block":"none";

  const siteUrl=sanitizeSocialUrl(data.site||"");
  siteBox.style.display=siteUrl?"block":"none";
  if(siteUrl){site.href=siteUrl;site.textContent=data.site}

  links.innerHTML="";
  renderSocial(data.instagram,"Instagram");
  renderSocial(data.github,"GitHub");
  if(!links.children.length)links.style.display="none";else links.style.display="flex";

  loadingBox.style.display="none";errorBox.style.display="none";profileCard.style.display="block";
}
async function verificarStatusLike(){
  likeStatus.textContent="";
  if(!usuarioLogado){likeBtn.disabled=true;likeBtn.textContent="Faça login para curtir";likeStatus.textContent="Entre na sua conta para apoiar esse perfil.";return}
  if(usuarioLogado.uid===perfilUid){likeBtn.disabled=true;likeBtn.textContent="Seu próprio perfil";likeStatus.textContent="Você não pode curtir o próprio perfil.";return}
  const ref=doc(db,"usuarios",perfilUid,"likesDiarios",`${usuarioLogado.uid}_${hojeId()}`);
  if((await getDoc(ref)).exists()){likeBtn.disabled=true;likeBtn.textContent="Curtida enviada hoje";likeStatus.textContent="Você já curtiu esse perfil hoje."}
  else{likeBtn.disabled=false;likeBtn.textContent="♥ Curtir perfil";likeStatus.textContent="Você pode enviar 1 curtida hoje para esse perfil."}
}
async function carregarPerfil(){
  if(!perfilUid){showError("Perfil não encontrado.");return}
  try{
    const snap=await getDoc(doc(db,"usuarios",perfilUid));
    if(!snap.exists()){showError("Esse perfil não existe.");return}
    renderProfile(snap.data());
    await verificarStatusLike();
  }catch(e){console.error(e);showError("Erro ao carregar o perfil.")}
}
async function curtirPerfil(){
  if(!usuarioLogado||usuarioLogado.uid===perfilUid||!limitarLike())return;
  likeBtn.disabled=true;
  try{
    const today=hojeId(),likeRef=doc(db,"usuarios",perfilUid,"likesDiarios",`${usuarioLogado.uid}_${today}`),perfilRef=doc(db,"usuarios",perfilUid);
    await runTransaction(db,async tx=>{
      const p=await tx.get(perfilRef);if(!p.exists())throw new Error("Perfil não existe.");
      const l=await tx.get(likeRef);if(l.exists())throw new Error("Você já curtiu esse perfil hoje.");
      tx.set(likeRef,{deUid:usuarioLogado.uid,paraUid:perfilUid,data:today,createdAt:serverTimestamp()});
      tx.update(perfilRef,{likesRecebidos:increment(1)});
    });
    perfilData.likesRecebidos=Number(perfilData.likesRecebidos||0)+1;
    likes.textContent=formatNumber(perfilData.likesRecebidos);
    likeBtn.textContent="Curtida enviada hoje";likeStatus.textContent="Você apoiou esse perfil com sucesso hoje.";
  }catch(e){
    console.error(e);likeBtn.disabled=false;
    if(String(e.message).includes("já curtiu")){likeBtn.textContent="Curtida enviada hoje";likeBtn.disabled=true;likeStatus.textContent="Você já curtiu esse perfil hoje."}
    else likeStatus.textContent="Não foi possível enviar a curtida agora.";
  }
}
likeBtn.addEventListener("click",curtirPerfil);
onAuthStateChanged(auth,async user=>{usuarioLogado=user||null;await carregarPerfil()});
</script>
<script src="./i18n.js"></script>
<script src="./guia-zyro.js" defer></script>
</body>
</html>
