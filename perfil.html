<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil | ZyroDev</title>
  <link rel="icon" type="image/png" href="./fotos/zraposa.png">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
    body{min-height:100vh;color:#fff;background:radial-gradient(circle at 10% 0%,rgba(255,106,0,.22),transparent 32%),radial-gradient(circle at 90% 100%,rgba(255,106,0,.18),transparent 32%),#070707;padding:28px 16px;overflow-x:hidden;position:relative}
body#bodyPerfil::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: var(--profile-banner-bg);
    background-size: cover;
    background-position: center;
    opacity: .16;
    z-index: 0;
    pointer-events: none;
}
    body#bodyPerfil::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.30);z-index:0;pointer-events:none}
    .card{width:min(680px,100%);margin:auto;background:rgba(18,18,18,.88);border:1px solid rgba(255,255,255,.1);border-radius:24px;overflow:hidden;box-shadow:0 25px 80px rgba(0,0,0,.5);backdrop-filter:blur(14px);position:relative;z-index:1}
    .banner{height:190px;background:linear-gradient(135deg,#151515,#242424);background-size:cover;background-position:center;position:relative;overflow:hidden}
.banner::before {
    content: "";
    position: absolute;
    inset: 0;

    background-image: var(--banner-bg);
    background-size: cover;
    background-position: center;

    opacity: 1;

    z-index: 0;
}
    .banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.12) 0%,rgba(0,0,0,.45) 55%,rgba(0,0,0,.82) 100%);z-index:1}

    .banner.sem-banner::before{content:"ADICIONE UM BANNER NO EDITAR PERFIL";position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.28);font-size:12px;font-weight:700;letter-spacing:.14em;z-index:2;background-image:none}
    .banner.com-banner::before{z-index:0}
    .banner.com-banner::after{z-index:1}
    .content{padding:0 28px 26px}
    .topo{display:flex;align-items:flex-end;gap:18px;margin-top:-58px;position:relative;z-index:2}
    .perfil-media-wrap{width:122px;height:122px;flex:0 0 122px;position:relative;overflow:visible}
    .foto,.video-perfil{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:5px solid #111;background:#161616;position:relative;z-index:1}
    .avatar-frame-overlay{
      position:absolute;
      inset:-22px;
      z-index:2;
      pointer-events:none;
      background-position:center;
      background-size:contain;
      background-repeat:no-repeat;
      animation:frameFloat 3.2s ease-in-out infinite;
    }
    .avatar-frame-overlay.moldura-animada{
      animation:frameFloat 2.7s ease-in-out infinite, framePulse 2.2s ease-in-out infinite;
    }
    @keyframes frameFloat{
      0%,100%{transform:translateY(0) rotate(0deg)}
      50%{transform:translateY(-2px) rotate(.8deg)}
    }
    @keyframes framePulse{
      0%,100%{filter:drop-shadow(0 0 2px rgba(255,106,0,.15))}
      50%{filter:drop-shadow(0 0 10px rgba(255,106,0,.65))}
    }
    .info-topo{padding-bottom:8px;min-width:0}
    .tag{display:inline-flex;padding:5px 9px;border-radius:999px;background:rgba(255,106,0,.12);border:1px solid rgba(255,106,0,.22);color:#ff9b5e;font-size:10px;font-weight:700;margin:0 5px 7px 0}
    .nome-linha{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.nome-linha h1{font-size:28px;line-height:1.1;word-break:break-word}.badges-perfil{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.badge-icon{width:26px;height:26px;object-fit:contain;display:block}.badges-mais{width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;font-size:12px;font-weight:800;cursor:pointer;display:grid;place-items:center;transition:.2s}.badges-mais:hover{background:rgba(255,106,0,.25);border-color:rgba(255,106,0,.5);transform:translateY(-1px)}
    .bio-box{margin-top:22px;padding:16px;border-radius:16px;background:#0d0d0d;border:1px solid rgba(255,255,255,.07);color:#d9d9d9;line-height:1.65;white-space:pre-wrap;word-break:break-word}
    .extras{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.extra{padding:8px 11px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);color:#bdbdbd;font-size:13px}.site{color:#ff8533;text-decoration:none}.site:hover{text-decoration:underline}
    .acoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;text-decoration:none;padding:11px 16px;border-radius:11px;font-weight:700;font-size:13px;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-2px)}.btn-primary{background:#ff6a00;color:#fff}.btn-secondary{background:#191919;color:#ddd;border:1px solid rgba(255,255,255,.1)}
    @media(max-width:600px){body{padding:12px}.banner{height:150px}.content{padding:0 16px 18px}.topo{margin-top:-45px;align-items:flex-end}.perfil-media-wrap,.avatar-frame{width:96px;height:96px;flex-basis:96px}.nome-linha h1{font-size:23px}.tag{font-size:9px}.acoes .btn{flex:1;text-align:center}}
  
    body{--profile-accent:#ff6a00}
    .perfil-role-admin .card{border-color:rgba(245,197,66,.55)!important;box-shadow:0 0 45px rgba(245,197,66,.18)}
    .perfil-role-admin .perfil-topo,.perfil-role-admin .nome-linha h1{color:#f5c542}
    .perfil-role-sponsor .card{border-color:rgba(37,99,235,.55)!important;box-shadow:0 0 45px rgba(37,99,235,.18)}
    .perfil-role-sponsor .perfil-topo,.perfil-role-sponsor .nome-linha h1{color:#4f8cff}
    .perfil-role-creator .card{border-color:rgba(168,85,247,.55)!important;box-shadow:0 0 45px rgba(168,85,247,.18)}
    .perfil-role-creator .perfil-topo,.perfil-role-creator .nome-linha h1{color:#c084fc}
</style>
</head>
<body id="bodyPerfil">
  <div class="card">
    <div id="bannerPerfil" class="banner sem-banner"></div>
    <div class="content">
      <div class="topo">
        <div id="perfilMediaWrap" class="perfil-media-wrap"></div>
        <div class="info-topo">
          <div><span class="tag">Trusted</span><span class="tag">Season 1</span></div>
          <div class="nome-linha"><h1 id="nomePerfil">Carregando...</h1><span id="badgesPerfil" class="badges-perfil"></span></div>
        </div>
      </div>
      <div class="bio-box" id="bioPerfil">Sua bio aparece aqui.</div>
      <div class="extras"><span id="empresaPerfil" class="extra" hidden></span><a id="sitePerfil" class="extra site" target="_blank" rel="noopener noreferrer" hidden></a></div>
      <div class="acoes">
        <a href="editar-perfil.html" class="btn btn-primary">Editar perfil</a>
        <a href="./perfil-publico.html" id="btnPerfilPublico" class="btn btn-secondary">Ver perfil público</a>
        <a href="./amizades.html" class="btn btn-secondary">Amigos e mensagens</a>
        <a href="index.html" class="btn btn-secondary">Voltar ao início</a>
        <button class="btn btn-secondary" id="btnSair">Sair da conta</button>
      </div>
    </div>
  </div>
  <script type="module" src="./perfil.js"></script>
<script src="./i18n.js"></script>
<script src="./guia-zyro.js" defer></script>
</body>
</html>
