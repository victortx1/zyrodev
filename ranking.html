<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking | ZyroDev</title>
<link rel="icon" type="image/png" href="./fotos/zraposa.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}
:root{--orange:#ff6a00;--orange2:#ff8533;--bg:#050505;--card:#101010;--muted:#9b9b9b}
body{min-height:100vh;color:#fff;background:
radial-gradient(circle at 8% 0%,rgba(255,106,0,.20),transparent 28%),
radial-gradient(circle at 92% 100%,rgba(255,106,0,.12),transparent 30%),#050505;
padding:28px 16px 70px;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent 20%,rgba(255,255,255,.018),transparent 70%)}
.container{width:min(1050px,100%);margin:auto;position:relative;z-index:1}
.ranking-header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}
.title-box{padding:4px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;color:#ff9b5e;font-size:.75rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;margin-bottom:8px}
.eyebrow:before{content:"";width:28px;height:2px;background:var(--orange);box-shadow:0 0 12px var(--orange)}
.title-box h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:900;letter-spacing:-.04em}
.glow-text{color:var(--orange);text-shadow:0 0 22px rgba(255,106,0,.28)}
.title-box p{color:var(--muted);margin-top:8px;font-size:.95rem}
.ranking-meta{display:flex;align-items:center;gap:9px;padding:12px 15px;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:rgba(255,255,255,.035);color:#cfcfcf;font-size:.85rem;font-weight:700}
.ranking-meta strong{color:#fff}
#rankingContent{animation:fadeUp .5s ease}
.top3-grid{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:15px;align-items:end;margin-bottom:18px}
.podium-card{position:relative;min-height:265px;padding:25px 20px 20px;border-radius:24px;border:1px solid rgba(255,255,255,.09);background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));box-shadow:0 18px 50px rgba(0,0,0,.28);backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;overflow:hidden;transition:.25s ease}
.podium-card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(255,106,0,.13),transparent 48%);pointer-events:none}
.podium-card:hover{transform:translateY(-5px);border-color:rgba(255,106,0,.38);box-shadow:0 24px 60px rgba(0,0,0,.38),0 0 28px rgba(255,106,0,.08)}
.podium-1{min-height:290px;border-color:rgba(255,106,0,.42);box-shadow:0 20px 55px rgba(0,0,0,.35),0 0 35px rgba(255,106,0,.10)}
.podium-1:after{content:"";position:absolute;top:-80px;left:50%;width:170px;height:170px;transform:translateX(-50%);background:rgba(255,106,0,.12);filter:blur(45px);border-radius:50%}
.place-badge{position:absolute;top:14px;left:14px;min-width:38px;height:30px;padding:0 10px;display:grid;place-items:center;border-radius:10px;background:rgba(255,106,0,.12);border:1px solid rgba(255,106,0,.22);color:#ff9b5e;font-size:.78rem;font-weight:900;z-index:2}
.podium-avatar{width:78px;height:78px;border-radius:22px;object-fit:cover;border:2px solid rgba(255,255,255,.12);margin:12px 0 13px;z-index:2;background:#161616}
.podium-1 .podium-avatar{width:92px;height:92px;border-radius:26px;border-color:rgba(255,106,0,.55);box-shadow:0 0 24px rgba(255,106,0,.16)}
.podium-name{font-size:1.1rem;font-weight:900;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2}
.podium-1 .podium-name{font-size:1.25rem}
.podium-handle{color:#999;font-size:.82rem;margin-top:5px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2}
.podium-stats{display:flex;justify-content:center;gap:9px;width:100%;margin-top:auto;padding-top:18px;z-index:2}
.stat-pill{display:flex;align-items:center;justify-content:center;gap:6px;min-width:110px;padding:10px 12px;border-radius:13px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);font-size:.84rem;font-weight:800}
.stat-pill .value{color:#fff}
.stat-pill.likes .value{color:#ff8533}
.table-wrapper{border:1px solid rgba(255,255,255,.08);border-radius:24px;overflow:hidden;background:rgba(255,255,255,.035);backdrop-filter:blur(14px);box-shadow:0 18px 55px rgba(0,0,0,.24)}
.ranking-table-header,.ranking-row{display:grid;grid-template-columns:92px 1fr 150px 150px;align-items:center;gap:16px;padding:15px 20px}
.ranking-table-header{background:rgba(255,255,255,.035);border-bottom:1px solid rgba(255,255,255,.07);color:#777;font-size:.7rem;text-transform:uppercase;letter-spacing:.13em;font-weight:800}
.ranking-row{min-height:82px;border-bottom:1px solid rgba(255,255,255,.055);cursor:pointer;transition:.22s ease}
.ranking-row:last-child{border-bottom:0}
.ranking-row:hover{background:rgba(255,106,0,.055);transform:translateX(2px)}
.rank-col{display:flex;align-items:center;gap:10px;font-weight:900}
.rank-number{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.07);color:#ddd;font-size:.78rem}
.user-col{display:flex;align-items:center;gap:13px;min-width:0}
.user-col img{width:48px;height:48px;border-radius:15px;object-fit:cover;border:1px solid rgba(255,255,255,.10);background:#161616;flex-shrink:0}
.user-info{min-width:0}
.user-info h3{font-size:.96rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-info p{font-size:.78rem;color:#777;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric{display:flex;align-items:center;gap:7px;font-weight:800;font-size:.9rem}
.metric .label{color:#666;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em}
.points{color:#fff;justify-content:flex-end}
.likes{color:#ff8533;justify-content:flex-end}
.empty,.loading,.error-message{padding:28px 20px;text-align:center;color:#888;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);border-radius:20px}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:850px){
.ranking-header{align-items:flex-start;flex-direction:column}.ranking-meta{width:100%}
.top3-grid{grid-template-columns:1fr}
.podium-card,.podium-1{min-height:245px}
.ranking-table-header{display:none}
.ranking-row{grid-template-columns:54px 1fr 90px 90px;padding:14px}
.metric .label{display:none}
}
@media(max-width:560px){
body{padding:18px 10px 55px}
.ranking-row{grid-template-columns:42px 1fr 70px 70px;gap:8px}
.user-col{gap:9px}.user-col img{width:42px;height:42px;border-radius:13px}
.user-info h3{font-size:.84rem}.user-info p{font-size:.7rem}
.metric{font-size:.78rem;gap:3px}.rank-number{width:30px;height:30px}
.stat-pill{min-width:0;flex:1;padding:9px 7px;font-size:.75rem}
}
</style>
</head>
<body>
<div class="container">
  <header class="ranking-header">
    <div class="title-box">
      <h1>Top 10 <span class="glow-text">ZyroDev</span></h1>
    </div>
    <div class="ranking-meta">🏆 <strong>Top 10</strong></div>
  </header>

  <div id="loadingBox" class="loading">Carregando ranking...</div>

  <main id="rankingContent" style="display:none">
    <section class="top3-grid" id="top3"></section>
    <section class="table-wrapper">
      <div class="ranking-table-header">
        <div>Posição</div><div>Perfil</div><div style="text-align:right">Curtidas</div><div style="text-align:right">Pontos</div>
      </div>
      <div id="rankingList"></div>
    </section>
  </main>

  <div id="errorBox" class="error-message" style="display:none"></div>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { escapeHtml, escapeAttr, sanitizeMediaUrl, isValidUid } from "./security-utils.js";

const loadingBox=document.getElementById("loadingBox");
const rankingContent=document.getElementById("rankingContent");
const errorBox=document.getElementById("errorBox");
const top3=document.getElementById("top3");
const rankingList=document.getElementById("rankingList");
const LIMITE_RANKING=10;

window.abrirPerfilPublico=function(uid){
  if(!isValidUid(uid)) return;
  window.location.href="./perfil-publico.html?uid="+encodeURIComponent(uid);
};

function formatNumber(v){return Number(v||0).toLocaleString("pt-BR")}
function normalizeUser(data,id){
  return {
    uid:data.uid||id,
    nome:(data.nome||"Usuário").trim()||"Usuário",
    tag:data.username?("@"+data.username):"@usuario",
    pontos:Number(data.pontos||0),
    likes:Number(data.likesRecebidos ?? data.likes ?? 0),
    avatar:data.foto||"",
  };
}
function avatar(url){return sanitizeMediaUrl(url)||"https://via.placeholder.com/100x100.png?text=User"}

function card(user,pos){
  const uid=escapeAttr(user.uid), name=escapeHtml(user.nome), img=escapeAttr(avatar(user.avatar));
  return `<article class="podium-card podium-${pos}" onclick="abrirPerfilPublico('${uid}')">
    <div class="place-badge">#${pos}</div>
    <img class="podium-avatar" src="${img}" alt="${name}">
    <div class="podium-name">${name}</div>
    <div class="podium-handle">${escapeHtml(user.tag)}</div>
    <div class="podium-stats">
      <div class="stat-pill"><span>⭐</span><span class="value">${formatNumber(user.pontos)}</span></div>
      <div class="stat-pill likes"><span>♥</span><span class="value">${formatNumber(user.likes)}</span></div>
    </div>
  </article>`;
}

function row(user,pos){
  const uid=escapeAttr(user.uid), name=escapeHtml(user.nome), img=escapeAttr(avatar(user.avatar));
  return `<article class="ranking-row" onclick="abrirPerfilPublico('${uid}')">
    <div class="rank-col"><span class="rank-number">#${pos}</span></div>
    <div class="user-col">
      <img src="${img}" alt="${name}">
      <div class="user-info"><h3>${name}</h3><p>${escapeHtml(user.tag)}</p></div>
    </div>
    <div class="metric likes"><span>♥</span><span>${formatNumber(user.likes)}</span></div>
    <div class="metric points"><span>⭐</span><span>${formatNumber(user.pontos)}</span></div>
  </article>`;
}

async function loadRanking(){
  try{
    loadingBox.style.display="block";rankingContent.style.display="none";errorBox.style.display="none";
    const snapshot=await getDocs(collection(db,"usuarios"));
    const users=snapshot.docs.map(d=>normalizeUser(d.data(),d.id));
    users.sort((a,b)=>b.pontos-a.pontos || b.likes-a.likes || a.nome.localeCompare(b.nome,"pt-BR"));
    const top=users.slice(0,LIMITE_RANKING);

    if(!top.length){
      loadingBox.style.display="none";errorBox.style.display="block";errorBox.textContent="Nenhum usuário encontrado no ranking.";return;
    }

    top3.innerHTML=top.slice(0,3).map((u,i)=>card(u,i+1)).join("");
    rankingList.innerHTML=top.slice(3).map((u,i)=>row(u,i+4)).join("");
    loadingBox.style.display="none";rankingContent.style.display="block";
  }catch(error){
    console.error("Erro ao carregar ranking:",error);
    loadingBox.style.display="none";errorBox.style.display="block";
    errorBox.textContent="Erro ao carregar o ranking. Verifique o Firebase.";
  }
}
onAuthStateChanged(auth,loadRanking);
</script>
<script src="./i18n.js"></script>
<script src="./guia-zyro.js" defer></script>
</body>
</html>
